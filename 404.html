<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面走丢了 · 我们的小站</title>
<style>
  :root{--p:#fb7185;--s:#c4b5fd;--ink:#3d3436}
  *{box-sizing:border-box}
  body{margin:0;min-height:100svh;display:grid;place-items:center;text-align:center;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#fff5f6,#fdf4ff)}
  h1{font-size:clamp(72px,18vw,150px);margin:0;line-height:1;
    background:linear-gradient(120deg,var(--p),var(--s));-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#8a7c80;margin:12px 0 26px}
  a{display:inline-block;padding:12px 28px;border-radius:999px;background:var(--p);color:#fff;
    text-decoration:none;font-weight:600;box-shadow:0 10px 24px -12px var(--p)}
</style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>这一页走丢了，但我们的故事还在。</p>
    <a href="/">回到首页</a>
  </div>
</body>
</html>
