<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fff7f8">
<meta name="description" content="记录我们的爱情故事">
<meta name="referrer" content="same-origin">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>我们的小站</title>
<style>
:root{
  --primary:#fb7185; --secondary:#c4b5fd;
  --ink:#3d3436; --ink-soft:#8a7c80; --line:#f2e4e7;
  --bg:#fffafb; --card:#ffffff;
  --radius:20px;
  --shadow:0 1px 2px rgba(60,40,50,.04),0 8px 24px -12px rgba(60,40,50,.16);
  --shadow-lg:0 24px 60px -24px rgba(60,40,50,.35);
  --serif:"Songti SC","Noto Serif SC",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --phbg:#fdeff1;      /* 图片未加载时的底色 */
  --paper:#ffffff;     /* 拍立得纸面 */
  --paper-ink:#3d3436; /* 纸面上的字 */
  --track:#f3dbe0;     /* 轨道/进度底色 */
}
/* 夜间模式：跟随系统，夜里自动柔和变暗 */
@media(prefers-color-scheme:dark){
  :root{
    --ink:#f1e7ea; --ink-soft:#a4919b; --line:#33242a;
    --bg:#141013; --card:#1e161b;
    --phbg:#2a1e23; --paper:#f4ebee; --paper-ink:#3d3436; --track:#3a2a31;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 24px 60px -24px rgba(0,0,0,.85);
  }
  .hero .veil{
    background:
      radial-gradient(120% 80% at 50% 20%,rgba(0,0,0,.3),rgba(0,0,0,.68)),
      linear-gradient(180deg,rgba(16,6,12,.62),rgba(16,6,12,.4) 45%,var(--bg));
  }
  .hero.noimg .veil{background:linear-gradient(160deg,#7f4b5c,#4a3a72 45%,var(--bg))}
  .nav.stuck{background:rgba(20,16,19,.85);backdrop-filter:saturate(1.4) blur(14px)}
  .nav.stuck .brand{color:var(--ink)}
  .nav.stuck .menu a{color:var(--ink-soft);text-shadow:none}
  .nav.stuck .menu a:hover,.nav.stuck .menu a.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
  .btn-g{background:var(--card);color:var(--ink)}
  .zi,.mp-ctrls button{background:var(--card)}
  .mp-lyric li{color:#7c6a71}
  .mpanel{background:rgba(30,22,27,.94)}
  .mp-bar{background:var(--line)}
  footer{background:linear-gradient(180deg,transparent,rgba(251,113,133,.07))}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);
  line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
::selection{background:var(--primary);color:#fff}
.wrap{width:min(1120px,92vw);margin-inline:auto}
.sec{padding:clamp(56px,9vw,110px) 0}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--primary);font-weight:700;margin-bottom:14px;
}
.eyebrow::before{content:"";width:26px;height:1px;background:var(--primary);opacity:.6}
h2.title{
  font-family:var(--serif);font-weight:600;letter-spacing:.02em;
  font-size:clamp(28px,4.4vw,44px);margin:0 0 10px;
}
.sub{color:var(--ink-soft);margin:0 0 44px;max-width:52ch}

/* ---------- nav：位于照片上方时透明+白字，滚出首屏后才变浅色磨砂+深字 ---------- */
.nav{
  position:fixed;inset:0 0 auto 0;z-index:60;
  background:transparent;transition:background .35s ease,box-shadow .35s ease;
  border-bottom:1px solid transparent;
}
.nav.stuck{
  background:rgba(255,250,251,.85);backdrop-filter:saturate(1.4) blur(14px);
  border-bottom-color:var(--line);box-shadow:0 6px 24px -18px rgba(60,40,50,.5);
}
.nav::after{
  content:"";position:absolute;left:0;bottom:-1px;height:2px;width:var(--p,0%);
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  transition:width .12s linear;
}
.nav .wrap{display:flex;align-items:center;gap:20px;height:64px}
/* 默认（照片上方）：白字 + 微光晕，保证深色照片上可读 */
.brand{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.06em;white-space:nowrap;
  color:rgba(255,255,255,.95);text-shadow:0 1px 10px rgba(0,0,0,.45)}
.brand i{color:var(--primary);font-style:normal;padding:0 2px}
.menu{margin-left:auto;display:flex;gap:4px;align-items:center}
.menu a{
  padding:8px 14px;border-radius:999px;font-size:14px;color:rgba(255,255,255,.82);
  transition:.2s;white-space:nowrap;text-shadow:0 1px 10px rgba(0,0,0,.45);
}
.menu a:hover,.menu a.on{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
/* 滚动进入内容区后：切深色字 */
.nav.stuck .brand{color:var(--ink);text-shadow:none}
.nav.stuck .menu a{color:var(--ink-soft);text-shadow:none}
.nav.stuck .menu a:hover,.nav.stuck .menu a.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
@media(max-width:720px){
  .nav .wrap{height:58px}
  .menu{margin-left:auto;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .menu::-webkit-scrollbar{display:none}
  .menu a{padding:7px 11px;font-size:13px}
}

/* ---------- hero ---------- */
.hero{
  position:relative;min-height:100svh;display:grid;place-items:center;
  text-align:center;color:#fff;isolation:isolate;overflow:hidden;
}
.hero .bg{position:absolute;inset:0;z-index:-2}
.hero .bg img{width:100%;height:100%;object-fit:cover;transform:scale(1.06)}
.hero .veil{
  position:absolute;inset:0;z-index:-1;
  background:
    radial-gradient(120% 80% at 50% 20%,rgba(0,0,0,.15),rgba(0,0,0,.55)),
    linear-gradient(180deg,rgba(30,10,20,.45),rgba(30,10,20,.25) 45%,rgba(255,250,251,.96));
}
.hero.noimg .veil{background:linear-gradient(160deg,#fecdd3,#e9d5ff 45%,#fffafb)}
.hero-in{padding:120px 0 80px}
.badge{
  display:inline-flex;align-items:center;gap:8px;padding:7px 16px;border-radius:999px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);
  backdrop-filter:blur(8px);font-size:13px;letter-spacing:.08em;margin-bottom:26px;
}
.names{
  font-family:var(--serif);font-weight:600;margin:0;line-height:1.18;
  font-size:clamp(38px,9vw,84px);letter-spacing:.04em;
  text-shadow:0 4px 30px rgba(0,0,0,.25);
}
.names .amp{
  display:inline-block;margin:0 .28em;color:var(--primary);
  font-size:.62em;vertical-align:.16em;
}
.hero p.lead{
  margin:22px auto 0;max-width:30ch;font-size:clamp(15px,2.2vw,19px);
  color:rgba(255,255,255,.9);letter-spacing:.1em;
}
.clock{display:flex;justify-content:center;gap:clamp(10px,2.4vw,22px);margin:44px 0 8px;flex-wrap:wrap}
.clock div{
  min-width:78px;padding:14px 10px;border-radius:16px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);
  backdrop-filter:blur(10px);
}
.clock b{
  display:block;font-size:clamp(24px,4.6vw,38px);font-weight:600;line-height:1.1;
  font-variant-numeric:tabular-nums;
}
.clock span{font-size:11px;letter-spacing:.18em;opacity:.82}
.clock-note{margin:16px 0 0;font-size:13px;color:rgba(255,255,255,.86);letter-spacing:.14em}
.clock-note b{font-weight:600}
.cta{display:flex;gap:12px;justify-content:center;margin-top:38px;flex-wrap:wrap}
.btn{
  display:inline-flex;align-items:center;gap:8px;padding:13px 26px;border-radius:999px;
  font-size:15px;font-weight:600;transition:.25s;box-shadow:var(--shadow);
}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{transform:translateY(-2px);box-shadow:0 14px 30px -12px var(--primary)}
.btn-g{background:rgba(255,255,255,.9);color:var(--ink)}
.btn-g:hover{transform:translateY(-2px)}
.heart-field{position:absolute;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.heart-field i{
  position:absolute;bottom:-40px;opacity:0;font-size:18px;
  animation:float 14s linear infinite;
}
@keyframes float{
  0%{transform:translateY(0) rotate(0);opacity:0}
  12%{opacity:.5}
  100%{transform:translateY(-108vh) rotate(220deg);opacity:0}
}
.down{
  position:absolute;left:50%;bottom:26px;translate:-50% 0;color:rgba(255,255,255,.85);
  animation:bob 2.4s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
/* 首屏入场：依次浮现 */
.hero-in>*{opacity:0;animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
.hero-in .badge{animation-delay:.1s}
.hero-in .names{animation-delay:.24s}
.hero-in .lead{animation-delay:.62s}
.hero-in .clock{animation-delay:.78s}
.hero-in .clock-note{animation-delay:.92s}
.hero-in .cta{animation-delay:1.02s}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
/* 名字逐字浮现 */
.names .ch{display:inline-block;opacity:0;animation:chIn .6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes chIn{
  from{opacity:0;transform:translateY(.22em) rotate(-5deg) scale(.94)}
  to{opacity:1;transform:none}
}
/* 花瓣飘落层 */
#petals{position:fixed;inset:0;z-index:50;pointer-events:none}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:26px;max-width:760px}
.tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;
  background:linear-gradient(180deg,var(--primary),var(--secondary));opacity:.35;border-radius:2px}
.tl-item{position:relative;padding:0 0 34px;opacity:0;transform:translateY(22px);transition:.6s}
.tl-item.in{opacity:1;transform:none}
.tl-item::before{
  content:"";position:absolute;left:-26px;top:8px;width:16px;height:16px;border-radius:50%;
  background:#fff;border:3px solid var(--primary);box-shadow:0 0 0 4px rgba(251,113,133,.14);
}
.tl-date{font-size:12px;letter-spacing:.16em;color:var(--primary);font-weight:700}
.tl-card{
  margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 24px;box-shadow:var(--shadow);transition:.25s;
}
.tl-card:hover{transform:translateX(4px);box-shadow:var(--shadow-lg)}
.tl-card h3{margin:0 0 6px;font-size:18px;font-family:var(--serif);font-weight:600}
.tl-card p{margin:0;color:var(--ink-soft);font-size:15px}

/* ---------- gallery ---------- */
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.shot{
  position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;
  background:#fdeff1;box-shadow:var(--shadow);cursor:zoom-in;opacity:0;
  transform:translateY(18px);transition:opacity .5s,transform .5s;
}
.shot.in{opacity:1;transform:none}
.shot img{width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.shot:hover img{transform:scale(1.06)}
.shot figcaption{
  position:absolute;inset:auto 0 0 0;padding:28px 14px 12px;font-size:13px;color:#fff;
  background:linear-gradient(180deg,transparent,rgba(30,10,20,.7));opacity:0;transition:.3s;
}
.shot:hover figcaption{opacity:1}

/* ---------- journey：时间轴 + 联动大图 ---------- */
.journey{display:grid;grid-template-columns:1.02fr .98fr;gap:clamp(26px,4vw,54px);align-items:start}
.stage{position:sticky;top:92px}
/* 拍立得相框：白纸 + 轻微倾斜 */
.frame{
  position:relative;background:var(--paper);padding:14px 14px 2px;border-radius:8px;
  box-shadow:var(--shadow-lg);cursor:zoom-in;
  transform:rotate(-.8deg);transition:transform .5s cubic-bezier(.2,.8,.2,1);
}
.frame:hover{transform:rotate(0deg) translateY(-3px)}
.frame .ph{
  position:relative;aspect-ratio:4/5;border-radius:3px;overflow:hidden;background:var(--phbg);
}
/* 双层交叉淡入：随滑动平滑换图 */
.frame .ly{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  opacity:0;transition:opacity .55s ease,transform 6s linear;
}
.frame .ly.on{opacity:1}
.frame .ly.zoom{transform:scale(1.06)}
/* 加载前的模糊占位（LQIP） */
.frame .lq{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  filter:blur(14px);transform:scale(1.1);transition:opacity .5s ease;
}
.frame .lq.off{opacity:0}
.zi{
  position:absolute;right:14px;bottom:14px;width:38px;height:38px;border-radius:50%;
  background:rgba(255,255,255,.9);display:grid;place-items:center;font-size:15px;
  box-shadow:var(--shadow);opacity:0;transition:.3s;
}
.frame:hover .zi{opacity:1}
.pcap{padding:16px 6px 12px;text-align:center}
.pcap b{
  display:block;font-family:var(--serif);font-style:italic;font-weight:600;
  font-size:18px;color:var(--paper-ink);line-height:1.5;letter-spacing:.03em;
}
.pcap span{font-size:11px;color:var(--primary);letter-spacing:.16em;font-weight:700}
.jbar{display:flex;gap:6px;justify-content:center;margin-top:14px}
.jbar i{
  width:22px;height:3px;border-radius:99px;background:var(--track);transition:.3s;
}
.jbar i.on{background:var(--primary);width:34px}
/* 时间轴：连线随滚动生长 */
.tl-wrap{position:relative}
.tl-line{
  position:absolute;left:7px;top:8px;width:2px;height:0;border-radius:2px;
  background:linear-gradient(180deg,var(--primary),var(--secondary));
  transition:height .45s cubic-bezier(.2,.8,.2,1);
}
.tl-item.active .tl-card{border-color:#ffd9e0;box-shadow:var(--shadow-lg);transform:translateX(4px)}
.tl-item.active::before{box-shadow:0 0 0 6px rgba(251,113,133,.2)}
.tl-item{cursor:pointer}

/* ---------- 多事件：年份分组 / 紧凑模式 / 计数 ---------- */
.tl-year{position:relative;padding:6px 0 20px}
.tl-year span{
  font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:.06em;
  color:var(--ink-soft);opacity:.5;
}
.tl-year::after{
  content:"";position:absolute;left:64px;right:0;top:50%;height:1px;
  background:linear-gradient(90deg,var(--line),transparent);
}
/* 事件多时自动紧凑 */
.tl.dense .tl-item{padding-bottom:20px}
.tl.dense .tl-card{padding:15px 18px;border-radius:14px}
.tl.dense .tl-card h3{font-size:16px;margin-bottom:4px}
.tl.dense .tl-card p{font-size:14px;line-height:1.6}
.tl.dense .tl-year{padding:2px 0 14px}
.tl.dense .tl-year span{font-size:21px}
.jcount{text-align:center;margin-top:12px;font-size:11px;color:var(--ink-soft);letter-spacing:.18em}
.jcount b{
  font-family:var(--serif);font-size:16px;font-weight:600;color:var(--primary);
  font-variant-numeric:tabular-nums;letter-spacing:0;
}

/* ---------- 事件封面卡：无照片时的排版封面 ---------- */
.frame .cv{
  position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  padding:24px;color:#fff;opacity:0;transition:opacity .5s ease;overflow:hidden;
}
.frame .cv.on{opacity:1}
.frame .cv::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 0%,rgba(255,255,255,.22),transparent 62%);
}
.cv .cico{
  width:42px;height:42px;opacity:.92;margin-bottom:16px;
  filter:drop-shadow(0 3px 10px rgba(0,0,0,.16));
}
.cv .cday{
  font-family:var(--serif);font-size:clamp(54px,8.5vw,84px);font-weight:600;line-height:.86;
  letter-spacing:-.02em;text-shadow:0 8px 26px rgba(0,0,0,.2);font-variant-numeric:tabular-nums;
}
.cv .cmon{
  margin-top:12px;font-size:11px;letter-spacing:.32em;font-weight:700;opacity:.92;
  text-shadow:0 2px 8px rgba(0,0,0,.18);
}
.cv .cttl{
  margin-top:18px;font-family:var(--serif);font-style:italic;font-size:15px;line-height:1.6;
  opacity:.96;text-shadow:0 2px 10px rgba(0,0,0,.22);
}
.cv .cno{
  position:absolute;right:16px;top:12px;font-size:11px;letter-spacing:.2em;opacity:.6;font-weight:700;
}
@media(max-width:900px){
  .journey{grid-template-columns:1fr;gap:22px}
  .stage{position:sticky;top:58px;z-index:5;background:var(--bg);padding-bottom:8px;max-width:620px;margin-inline:auto;width:100%}
  .frame{transform:rotate(-.6deg);max-width:520px;margin-inline:auto}
  .frame .ph{aspect-ratio:16/11}
  .pcap{padding:13px 6px 8px}
  .pcap b{font-size:16px}
}

/* ---------- 漂浮音乐窗 ---------- */
.mfloat{position:fixed;right:clamp(12px,2.4vw,24px);bottom:clamp(12px,2.4vw,24px);z-index:80;
  display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.mpanel{
  width:min(318px,84vw);background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(16px);
  border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);padding:16px 18px 14px;
  opacity:0;transform:scale(.92) translateY(12px);transform-origin:bottom right;pointer-events:none;
  transition:.3s cubic-bezier(.2,.8,.2,1);
}
.mfloat.open .mpanel{opacity:1;transform:none;pointer-events:auto}
.mp-head{display:flex;align-items:flex-start;gap:10px}
.mp-head .t{min-width:0;flex:1}
.mp-head b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-head span{font-size:12px;color:var(--ink-soft)}
.mp-x{font-size:20px;line-height:1;color:var(--ink-soft);padding:2px 4px}
.mp-lyric{height:78px;overflow:hidden;position:relative;margin:12px 0 10px;
  mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent)}
.mp-lyric ul{list-style:none;margin:0;padding:0;transition:transform .45s cubic-bezier(.2,.8,.2,1);text-align:center}
.mp-lyric li{padding:3px 0;font-size:13px;color:#c6b0b6;transition:.3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mp-lyric li.cur{color:var(--primary);font-weight:600}
.mp-bar{height:4px;border-radius:99px;background:#f4e6e9;overflow:hidden;cursor:pointer}
.mp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),var(--secondary))}
.mp-ctrls{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:12px}
.mp-ctrls button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13px;
  background:#fff;border:1px solid var(--line);transition:.2s}
.mp-ctrls button:hover{border-color:var(--primary);color:var(--primary)}
.mp-ctrls .main{width:44px;height:44px;background:var(--primary);border-color:var(--primary);color:#fff;font-size:15px}
.mfab{
  width:58px;height:58px;border-radius:50%;position:relative;flex:none;
  background:radial-gradient(circle at 50% 50%,#fff 0 19%,#241a20 19.5% 99%,#3a2c34 100%);
  box-shadow:var(--shadow-lg);display:grid;place-items:center;color:#fff;font-size:17px;
  animation:spin 14s linear infinite;animation-play-state:paused;transition:transform .25s;
}
.mfloat.playing .mfab{animation-play-state:running}
.mfab:hover{transform:scale(1.07)}
.mfab.idle::after{
  content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--primary);
  animation:pulse 2s ease-out infinite;
}
@keyframes pulse{0%{transform:scale(.9);opacity:.7}100%{transform:scale(1.25);opacity:0}}
@media(max-width:520px){
  .mpanel{width:min(300px,88vw)}
  .mfab{width:50px;height:50px;font-size:15px}
  .mp-lyric{height:68px}
  .hero-in{padding:104px 0 64px}
  .clock div{min-width:70px;padding:12px 8px}
}

/* ---------- footer ---------- */
footer{
  background:linear-gradient(180deg,transparent,rgba(253,232,236,.5));
  border-top:1px solid var(--line);padding:44px 0 100px;text-align:center;
}
footer p{margin:0;color:var(--ink-soft);font-size:13px;letter-spacing:.06em}
footer .sm{margin-top:10px;font-family:var(--serif);font-size:15px;color:var(--ink)}

/* ---------- lightbox ---------- */
.lb{
  position:fixed;inset:0;z-index:99;background:#150c11;display:none;
  place-items:center;padding:4vh 4vw;
}
.lb.open{display:grid}
body.locked{overflow:hidden}
.lb img{max-width:100%;max-height:88vh;border-radius:12px;box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
.lb .x{position:absolute;top:16px;right:20px;color:#fff;font-size:30px;line-height:1;opacity:.8;z-index:3;cursor:pointer}
.lb .nav{
  position:absolute;top:50%;translate:0 -50%;color:#fff;font-size:26px;
  width:48px;height:48px;border-radius:50%;display:grid;place-items:center;
  background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.25);opacity:.9;transition:.2s;
  z-index:2;cursor:pointer;
}
.lb .nav:hover{background:rgba(0,0,0,.6);opacity:1}
.lb .nav.prev{left:max(12px,2vw)}.lb .nav.next{right:max(12px,2vw)}
@media (max-width:600px){
  .lb .nav{top:auto;bottom:18px;translate:0 0;width:42px;height:42px;font-size:22px}
  .lb .nav.prev{left:18px;right:auto}
  .lb .nav.next{right:18px;left:auto}
}

/* ---------- 通用弹层锁定滚动 ---------- */
body.locked{overflow:hidden}

.reveal{opacity:0;transform:translateY(24px);transition:.7s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .reveal,.tl-item{opacity:1;transform:none}
}

/* ---------- 开场加载 ---------- */
.loader{
  position:fixed;inset:0;z-index:999;background:var(--bg);
  display:grid;place-items:center;transition:opacity .55s ease,visibility .55s;
}
.loader.done{opacity:0;visibility:hidden;pointer-events:none}
.ld-box{display:grid;justify-items:center;text-align:center}
.ld-heart{width:72px;height:72px;position:relative;display:grid;place-items:center}
.ld-heart svg{
  width:42px;height:42px;fill:var(--primary);
  animation:ldBeat 1.15s ease-in-out infinite;
  filter:drop-shadow(0 6px 16px rgba(251,113,133,.4));
}
.ld-heart::before,.ld-heart::after{
  content:"";position:absolute;inset:0;border-radius:50%;
  border:1.5px solid var(--primary);opacity:0;animation:ldRing 1.7s ease-out infinite;
}
.ld-heart::after{animation-delay:.85s}
@keyframes ldBeat{
  0%,100%{transform:scale(1)}12%{transform:scale(1.2)}24%{transform:scale(1)}
  36%{transform:scale(1.12)}48%{transform:scale(1)}
}
@keyframes ldRing{0%{transform:scale(.5);opacity:.55}100%{transform:scale(1.4);opacity:0}}
.ld-title{
  margin-top:30px;font-family:var(--serif);font-size:22px;font-weight:600;
  letter-spacing:.32em;text-indent:.32em;color:var(--ink);
  animation:ldFade .7s .2s cubic-bezier(.2,.8,.2,1) backwards;
}
.ld-bar{
  margin:20px auto 0;width:120px;height:2px;border-radius:99px;
  background:var(--track);overflow:hidden;
}
.ld-bar i{
  display:block;height:100%;width:0;
  background:linear-gradient(90deg,var(--primary),var(--secondary));
  animation:ldBar 0.8s .1s ease-out forwards;
}
@keyframes ldBar{
  0%{width:0}
  70%{width:64%}
  100%{width:92%}
}
@keyframes ldFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* 首访时：入场动画先暂停，等加载层退场后再继续 */
.hold .hero-in>*,.hold .hero-in .ch{animation-play-state:paused}
</style>
</head>

/* 开场加载动画：首访 0.9s，二访 300ms；减动效直接跳过 */
(function () {
  const ld = document.getElementById("loader");
  if (!ld) return;
  const tEl = document.getElementById("ldTitle");
  if (tEl) tEl.textContent = DATA.title || "";
  let dur = 900;
  try {
    if (sessionStorage.getItem("lv_seen")) dur = 300;
    else setTimeout(() => { try { sessionStorage.setItem("lv_seen", "1"); } catch (e) {} }, 300);
  } catch (e) {}
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) dur = 0;
  dur = Math.min(dur, 4000);
  if (dur > 0) document.documentElement.classList.add("hold");
  const kill = () => {
    document.documentElement.classList.remove("hold");
    ld.classList.add("done");
    setTimeout(() => ld.remove(), 700);
  };
  if (dur === 0) kill();
  else setTimeout(kill, dur);
})();

/* 计时器：年 / 月 / 日 */
(function () {
  const start = DATA.togetherDate ? new Date(DATA.togetherDate + "T00:00:00") : null;
  const clock = $("#clock"), note = document.querySelector(".clock-note");
  if (!start || isNaN(start)) { clock.style.display = "none"; if (note) note.style.display = "none"; $("#badge").style.display = "none"; return; }
  $("#since").textContent = String(DATA.togetherDate).replace(/-/g, ".");
  function calc() {
    const n = new Date();
    let y = n.getFullYear() - start.getFullYear();
    let m = n.getMonth() - start.getMonth();
    let d = n.getDate() - start.getDate();
    if (d < 0) { m--; d += new Date(n.getFullYear(), n.getMonth(), 0).getDate(); }
    if (m < 0) { y--; m += 12; }
    return { y, m, d, days: Math.floor((n - start) / 864e5) };
  }
  function tick() {
    const v = calc();
    $("#cd-y").textContent = v.y;
    $("#cd-mo").textContent = v.m;
    $("#cd-d").textContent = v.d;
    $("#cd-total").textContent = v.days;
  }
  tick(); setInterval(tick, 30000);
})();

if (!tl.length && photos.length) {
  tl = [{ date: DATA.togetherDate || "", title: "我们的瞬间", description: DATA.story || "" }];
}
const E = tl.length, P = photos.length;

/* 照片分配：
   ① 事件带 photoGi（槽位显式绑定）→ 直接取该照片，互不挤占
   ② 其余事件：照片够则一事件一图；不够则均匀分散，空出的用封面卡
   绑定过的照片会被"预留"，自动分配不再复用，避免同一张图重复出现 */
const picks = tl.map(() => null);
const bound = {};
tl.forEach((t, i) => {
  const gi = (typeof t.photoGi === "number") ? t.photoGi : -1;
  if (gi >= 0 && gi < P) { picks[i] = Object.assign({}, photos[gi], { gi }); bound[gi] = 1; }
});
const free = [];
for (let k = 0; k < P; k++) if (!bound[k]) free.push(k);
const unbound = tl.map((t, i) => picks[i] ? -1 : i);
const U = unbound.filter(i => i >= 0).length, F = free.length;
if (F && U) {
  if (F >= U) {
    unbound.forEach((evI, n) => { if (n < F) { const gi = free[n]; picks[evI] = Object.assign({}, photos[gi], { gi }); } });
  } else {
    const step = U / F, used = {};
    for (let k = 0; k < F; k++) {
      let slot = Math.floor(k * step + step / 2);
      while (used[slot] && slot < U - 1) slot++;
      used[slot] = 1;
      const evI = unbound[slot], gi = free[k];
      picks[evI] = Object.assign({}, photos[gi], { gi });
    }
  }
}

  "linear-gradient(150deg,#4da794,#6b96dc)"
];
const MON = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
function iconOf(t) {
  const s = (t.title || "") + " " + (t.description || "");
  if (/生日|蛋糕|周岁|周年/.test(s)) return "cake";
  if (/旅|游|出发|海|山|城|机场|高铁|trip/i.test(s)) return "pin";
  if (/礼物|惊喜|收到|送|花/.test(s)) return "gift";
  if (/照|拍|合影|写真|相片/.test(s)) return "camera";
  if (/夜|星|月|晚安|跨年|烟花/.test(s)) return "star";
  return "heart";
}
function faceHtml(t, i) {
  const m = String(t.date || "").match(/(\d{4})-(\d{2})-(\d{2})/);
  const day = m ? m[3] : String(i + 1).padStart(2, "0");
  const ym = m ? MON[+m[2] - 1] + " " + m[1] : "";
  return `<div style="position:absolute;inset:0;background:${GRAD[i % GRAD.length]}"></div>
    <div style="position:relative">
      <svg class="cico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"
           stroke-linecap="round" stroke-linejoin="round"><path d="${ICON[iconOf(t)] || ICON.heart}"/></svg>
      <div class="cday">${esc(day)}</div>
      <div class="cmon">${esc(ym)}</div>
      ${t.title ? `<div class="cttl">${esc(t.title)}</div>` : ""}
    </div>
    <span class="cno">NO.${String(i + 1).padStart(2, "0")}</span>`;
}

/* 时间轴：按年份分组；事件多时自动紧凑 */
(function () {
  const html = [];
  let lastY = "";
  tl.forEach((t, i) => {
    const y = String(t.date || "").slice(0, 4);
    if (y && y !== lastY) { lastY = y; html.push(`<div class="tl-year"><span>${esc(y)}</span></div>`); }
    html.push(`
  <div class="tl-item" data-i="${i}">
    <div class="tl-date">${esc(t.date)}</div>
    <div class="tl-card"><h3>${esc(t.title)}</h3><p>${esc(t.description)}</p></div>
  </div>`);
  });
  const box = $("#tl");
  box.innerHTML = html.join("") || '<p class="sub">还没有故事，一起去创造吧。</p>';
  if (E > 8) box.classList.add("dense");
})();

/* 进度指示：事件少用小圆点，事件多改用 03 / 22 计数 */
if (E > 12) {
  $("#jBar").style.display = "none";
  $("#jCount").innerHTML = `<b id="jNow">01</b> / ${String(E).padStart(2, "0")}`;
} else {
  $("#jCount").style.display = "none";
  $("#jBar").innerHTML = tl.map((t, i) => `<i data-i="${i}"></i>`).join("");
}

let curE = -1, topA = true;
function setEvent(i) {
  if (i < 0 || i >= E || i === curE) return;
  curE = i;
  const t = tl[i], p = picks[i];
  $("#jTitle").textContent = t.title || "";
  $("#jDate").textContent = t.date || "";
  document.querySelectorAll(".tl-item").forEach((el, k) => el.classList.toggle("active", k === i));
  document.querySelectorAll("#jBar i").forEach((el, k) => el.classList.toggle("on", k === i));
  const nowEl = $("#jNow");
  if (nowEl) nowEl.textContent = String(i + 1).padStart(2, "0");
  const frame = $("#frame"), lq = $("#jLq"), cv = $("#jCv");
  /* 入口同步决定显示层，避免异步切换导致层状态错乱、图文不同步 */
  const show = topA ? $("#jImgA") : $("#jImgB");
  const hide = topA ? $("#jImgB") : $("#jImgA");
  topA = !topA;
  if (!p) {
    /* 该事件没有照片：展示排版封面卡，不用随机图占位 */
    show.classList.remove("on", "zoom");
    hide.classList.remove("on", "zoom");
    lq.classList.add("off");
    cv.innerHTML = faceHtml(t, i);
    cv.classList.add("on");
    frame.style.cursor = "default";
    frame.dataset.kind = "card";
    return;
  }
  frame.dataset.kind = "photo";
  cv.classList.remove("on");
  /* 先显示该图的模糊占位，清晰图就绪后淡出 */
  if (p.lqip) {
    lq.src = p.lqip;
    lq.classList.remove("off");
  }
  frame.style.cursor = "zoom-in";
  show.src = p.src;
  show.alt = p.title || t.title || "";
  let settled = false;
  const reveal = () => {
    if (settled || curE !== i) return;
    settled = true;
    show.classList.add("on", "zoom");
    hide.classList.remove("on", "zoom");
    frame.dataset.ready = "1";
    setTimeout(() => lq.classList.add("off"), 120);
  };
  const pre = new Image();
  pre.onload = reveal;
  pre.onerror = reveal;
  pre.src = p.src;
  if (pre.complete) reveal();
  setTimeout(reveal, 1500);
}

/* 点击时间轴 —— 平滑滑到该事件，由滑动驱动换图 */
$("#tl").onclick = e => {
  const it = e.target.closest(".tl-item");
  if (it) it.scrollIntoView({ behavior: "smooth", block: "center" });
};
$("#frame").onclick = () => {
  const p = picks[curE];
  if (p) openLb(p.gi);
};
setEvent(0);

/* 滚动驱动：切换照片 + 顶部进度条 + 时间轴连线生长 */
(function () {
  const items = document.querySelectorAll(".tl-item");
  const nav = $("#nav"), line = $("#tlLine"), tlBox = $("#tl");
  function progress() {
    const h = document.documentElement.scrollHeight - innerHeight;
    const p = h > 0 ? Math.min(1, Math.max(0, scrollY / h)) : 0;
    nav.style.setProperty("--p", (p * 100).toFixed(2) + "%");
  }
  function growLine() {
    if (!line || !tlBox || curE < 0 || !items[curE]) return;
    const base = tlBox.getBoundingClientRect().top;
    const r = items[curE].getBoundingClientRect();
    line.style.height = Math.max(0, r.top + 16 - base) + "px";
  }
  function pick() {
    const mid = innerHeight * 0.45;
    let best = curE < 0 ? 0 : curE, bd = Infinity;
    items.forEach((el, i) => {
      const r = el.getBoundingClientRect();
      const d = Math.abs(r.top + r.height / 2 - mid);
      if (d < bd) { bd = d; best = i; }
    });
    if (best !== curE) setEvent(best);
    growLine();
  }
  function onScroll() { progress(); pick(); }
  addEventListener("scroll", onScroll, { passive: true });
  addEventListener("resize", onScroll, { passive: true });
  onScroll();
})();

/* 灯箱 */
(function () {
  const lb = $("#lb"), img = $("#lbImg");
  let cur = 0;
  window.openLb = function (i) {
    if (!photos.length) return;
    cur = (i + photos.length) % photos.length;
    img.src = photos[cur].full || photos[cur].src;
    img.alt = photos[cur].title || "";
    lb.classList.add("open");
    document.body.classList.add("locked");
  };
  function hide() { lb.classList.remove("open"); document.body.classList.remove("locked"); }
  $("#lbX").onclick = hide;
  $("#lbPrev").onclick = e => { e.stopPropagation(); openLb(cur - 1); };
  $("#lbNext").onclick = e => { e.stopPropagation(); openLb(cur + 1); };
  lb.onclick = e => { if (e.target === lb) hide(); };
  document.addEventListener("keydown", e => {
    if (!lb.classList.contains("open")) return;
    if (e.key === "Escape") hide();
    if (e.key === "ArrowLeft") openLb(cur - 1);
    if (e.key === "ArrowRight") openLb(cur + 1);
  });
})();

/* 漂浮音乐窗（背景音乐 + 歌词） */
(function () {
  const songs = DATA.music || [];
  const float = $("#mfloat");
  if (!songs.length) { float.remove(); return; }

  const audio = $("#audio"), fab = $("#mfFab"), lyricBox = $("#mfLyric");
  let idx = 0, lrc = [], lines = [], everPlayed = false;

  function parseLrc(text) {
    const out = [];
    String(text || "").split(/\r?\n/).forEach(line => {
      const m = line.match(/^\s*\[(\d{1,2}):(\d{2})(?:[.:]\d{1,3})?\]\s*(.*)$/);
      if (m) {
        const txt = m[3].trim();
        if (txt) out.push({ t: (+m[1]) * 60 + (+m[2]), txt });
      }
    });
    return out.sort((a, b) => a.t - b.t);
  }

  function renderLyric() {
    if (!lrc.length) {
      lyricBox.innerHTML = '<div style="text-align:center;color:var(--ink-soft);font-size:12px;padding-top:26px">暂无歌词</div>';
      lines = [];
      return;
    }
    lyricBox.innerHTML = "<ul>" + lrc.map((l, i) => `<li>${esc(l.txt)}</li>`).join("") + "</ul>";
    lines = [...lyricBox.querySelectorAll("li")];
  }

  function syncLyric() {
    if (!lines.length) return;
    const t = audio.currentTime;
    let cur = -1;
    for (let i = 0; i < lrc.length; i++) { if (lrc[i].t <= t + 0.4) cur = i; else break; }
    if (cur < 0) { lines.forEach(li => li.classList.remove("cur")); return; }
    if (lines[cur] && !lines[cur].classList.contains("cur")) {
      lines.forEach((li, i) => li.classList.toggle("cur", i === cur));
      lyricBox.querySelector("ul").style.transform = "translateY(" + (26 - cur * 22) + "px)";
    }
  }

  function load(i, auto) {
    idx = (i + songs.length) % songs.length;
    const s = songs[idx];
    audio.src = s.url;
    $("#mfTitle").textContent = s.title || "未命名";
    $("#mfArtist").textContent = s.artist || "";
    lrc = parseLrc(s.lyrics); renderLyric();
    $("#mfProg").style.width = "0";
    if (auto) audio.play().catch(() => {});
  }

  fab.onclick = () => float.classList.toggle("open");
  $("#mfClose").onclick = () => float.classList.remove("open");
  $("#mfPlay").onclick = () => { audio.paused ? audio.play().catch(() => {}) : audio.pause(); };
  $("#mfPrev").onclick = () => load(idx - 1, !audio.paused);
  $("#mfNext").onclick = () => load(idx + 1, !audio.paused);
  $("#mfBar").onclick = e => {
    if (!audio.duration) return;
    const r = e.currentTarget.getBoundingClientRect();
    audio.currentTime = (e.clientX - r.left) / r.width * audio.duration;
  };

  audio.onplay = () => {
    $("#mfPlay").textContent = "❚❚";
    float.classList.add("playing");
    fab.classList.remove("idle");
    everPlayed = true;
  };
  audio.onpause = () => { $("#mfPlay").textContent = "▶"; float.classList.remove("playing"); };
  audio.ontimeupdate = () => {
    if (audio.duration) $("#mfProg").style.width = (audio.currentTime / audio.duration * 100) + "%";
    syncLyric();
  };
  audio.onended = () => load(idx + 1, true);

  load(0, false);

  // 加载即尝试自动播放背景音乐（多数浏览器禁止无交互有声播放，失败则等首次交互兜底）
  const tryPlay = () => { audio.play().catch(() => {}); };
  tryPlay();
  audio.addEventListener("canplay", tryPlay, { once: true });

  // 首次交互兜底：无手势被拦截时，用户首次点击/按键即开播
  const kick = () => {
    if (!everPlayed && audio.paused) tryPlay();
  };
  ["pointerdown", "keydown", "touchstart", "wheel"].forEach(ev =>
    addEventListener(ev, kick, { once: true, passive: true })
  );
  document.addEventListener("visibilitychange", () => { if (!document.hidden) kick(); });
})();

/* 花瓣飘落 */
(function () {
  const cv = $("#petals");
  if (!cv) return;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { cv.remove(); return; }
  const ctx = cv.getContext("2d");
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const colors = ["#f9a8c0", "#f6bfd2", "#e6b6e6", "#fcd3da"];
  let w = 0, h = 0, ps = [];
  function spawn(init) {
    return {
      x: Math.random() * w,
      y: init ? Math.random() * h : -30,
      r: 5 + Math.random() * 7,
      sp: 0.25 + Math.random() * 0.55,
      sw: 0.3 + Math.random() * 0.8,
      ph: Math.random() * Math.PI * 2,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.014,
      a: 0.3 + Math.random() * 0.35,
      c: colors[(Math.random() * colors.length) | 0],
    };
  }
  function size() {
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    cv.style.width = w + "px"; cv.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = w < 600 ? 9 : w < 1024 ? 14 : 20;
    ps = Array.from({ length: n }, () => spawn(true));
  }
  let last = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    if (t - last < 33) return;          /* 约 30fps，省电 */
    last = t;
    ctx.clearRect(0, 0, w, h);
    for (let i = 0; i < ps.length; i++) {
      const p = ps[i];
      p.y += p.sp; p.ph += 0.012; p.rot += p.vr;
      p.x += Math.sin(p.ph) * p.sw * 0.5;
      if (p.y > h + 30 || p.x < -50 || p.x > w + 50) { ps[i] = spawn(false); continue; }
      ctx.save();
      ctx.globalAlpha = p.a;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.ellipse(0, 0, p.r, p.r * 0.56, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }
  size();
  addEventListener("resize", size, { passive: true });
  requestAnimationFrame(frame);
})();

/* 滚动揭示 + 导航高亮 */
(function () {
  const io = new IntersectionObserver(es => {
    es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, { rootMargin: "0px 0px -8% 0px", threshold: .08 });
  document.querySelectorAll(".reveal,.tl-item").forEach((el, i) => {
    el.style.transitionDelay = Math.min(i, 8) * 45 + "ms";
    io.observe(el);
  });

  const nav = $("#nav");
  const links = [...document.querySelectorAll("#menu a")];
  const secs = links.map(a => document.querySelector(a.getAttribute("href"))).filter(Boolean);
  const hero = document.querySelector(".hero");
  let heroH = hero ? hero.offsetHeight - 64 : 400;
  const onScroll = () => {
    nav.classList.toggle("stuck", scrollY > heroH);
    const y = scrollY + innerHeight * .35;
    let cur = 0;
    secs.forEach((s, i) => { if (s.offsetTop <= y) cur = i; });
    links.forEach((a, i) => a.classList.toggle("on", i === cur));
  };
  addEventListener("resize", () => { heroH = hero ? hero.offsetHeight - 64 : 400; }, { passive: true });
  addEventListener("scroll", onScroll, { passive: true });
  onScroll();
})();
</script>
</body>
</html>
